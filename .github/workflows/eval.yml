name: eval

# Manually triggered. Runs the 10 Phase 1 validation questions (PLAN §12)
# through retrieval + Claude synthesis and uploads a Markdown report as
# a workflow artifact. The report is sized for hand-grading.
#
# Cost: ~10 × $0.04 ≈ $0.40 for a full eval pass on Sonnet 4.6.
#
# Required secrets:
#   SUPABASE_DB_URL    - Session-mode pooler connection string
#   VOYAGE_API_KEY     - Voyage AI key
#   ANTHROPIC_API_KEY  - Anthropic API key

on:
  workflow_dispatch:
    inputs:
      question:
        description: "Single question N (1-10), or blank for all 10"
        required: false
        type: string
      date_from:
        description: "Earliest issue date YYYY-MM-DD (optional)"
        required: false
        type: string
      date_to:
        description: "Latest issue date YYYY-MM-DD (optional)"
        required: false
        type: string
      top:
        description: "Chunks per question"
        required: false
        type: string
        default: "12"
      no_rerank:
        description: "Skip Voyage rerank-2.5"
        required: false
        type: boolean
        default: false

concurrency:
  group: eval-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HERALD_QUESTION: ${{ inputs.question }}
      HERALD_DATE_FROM: ${{ inputs.date_from }}
      HERALD_DATE_TO: ${{ inputs.date_to }}
      HERALD_TOP: ${{ inputs.top }}
      HERALD_NO_RERANK: ${{ inputs.no_rerank }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Sync deps
        run: uv sync --frozen
      - name: Sanity-check required secrets are present
        run: |
          [ -n "$SUPABASE_DB_URL" ]   || { echo "SUPABASE_DB_URL missing"; exit 1; }
          [ -n "$VOYAGE_API_KEY" ]    || { echo "VOYAGE_API_KEY missing";  exit 1; }
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "ANTHROPIC_API_KEY missing"; exit 1; }
          echo "secrets present (lengths only):"
          echo "  db=${#SUPABASE_DB_URL} voyage=${#VOYAGE_API_KEY} anthropic=${#ANTHROPIC_API_KEY}"
      - name: Eval
        run: |
          mkdir -p eval-output
          ts=$(date -u +"%Y-%m-%d-%H%M%S")
          out="eval-output/herald-eval-${ts}.md"
          args=("eval" "--output" "$out")
          [ -n "$HERALD_QUESTION" ]  && args+=("--question" "$HERALD_QUESTION")
          [ -n "$HERALD_DATE_FROM" ] && args+=("--from" "$HERALD_DATE_FROM")
          [ -n "$HERALD_DATE_TO" ]   && args+=("--to"   "$HERALD_DATE_TO")
          [ -n "$HERALD_TOP" ]       && args+=("--top"  "$HERALD_TOP")
          [ "$HERALD_NO_RERANK" = "true" ] && args+=("--no-rerank")
          echo "Running: herald ${args[*]}"
          uv run herald "${args[@]}"
          echo
          echo "----- BEGIN REPORT -----"
          cat "$out"
          echo "----- END REPORT -----"
      - name: Upload eval report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-output/*.md
          if-no-files-found: warn
