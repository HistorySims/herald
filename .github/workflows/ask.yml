name: ask

# Manually triggered. Runs `herald ask "<question>"` against the
# corpus already in Supabase and prints ranked passages to the
# Actions log. Pure retrieval — no LLM synthesis yet (that lands in
# slice 4 alongside Claude).
#
# Required secrets (same as ingest):
#   SUPABASE_DB_URL  - Supabase Session-mode pooler connection string
#   VOYAGE_API_KEY   - Voyage AI key (used for query embedding + rerank-2.5)

on:
  workflow_dispatch:
    inputs:
      question:
        description: "Natural-language question"
        required: true
        type: string
      date_from:
        description: "Earliest issue date YYYY-MM-DD (optional)"
        required: false
        type: string
      date_to:
        description: "Latest issue date YYYY-MM-DD (optional)"
        required: false
        type: string
      top:
        description: "How many chunks to return"
        required: false
        type: string
        default: "12"
      no_rerank:
        description: "Skip Voyage rerank-2.5 (return RRF order only)"
        required: false
        type: boolean
        default: false

concurrency:
  # Don't run two queries concurrently; we're rate-limited at LOC-class
  # speeds via Voyage anyway, and it keeps the log tidy.
  group: ask-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      # Pass inputs through env vars rather than interpolating into the
      # shell directly — protects against quoting / injection if the
      # question contains shell metacharacters.
      HERALD_QUESTION: ${{ inputs.question }}
      HERALD_DATE_FROM: ${{ inputs.date_from }}
      HERALD_DATE_TO: ${{ inputs.date_to }}
      HERALD_TOP: ${{ inputs.top }}
      HERALD_NO_RERANK: ${{ inputs.no_rerank }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Sync deps
        run: uv sync --frozen
      - name: Sanity-check required secrets are present
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "SUPABASE_DB_URL secret is missing"; exit 1; }
          [ -n "$VOYAGE_API_KEY" ]  || { echo "VOYAGE_API_KEY secret is missing"; exit 1; }
          echo "secrets present (lengths only): db=${#SUPABASE_DB_URL} voyage=${#VOYAGE_API_KEY}"
      - name: Ask
        run: |
          args=("ask" "$HERALD_QUESTION")
          [ -n "$HERALD_DATE_FROM" ] && args+=("--from" "$HERALD_DATE_FROM")
          [ -n "$HERALD_DATE_TO" ]   && args+=("--to"   "$HERALD_DATE_TO")
          [ -n "$HERALD_TOP" ]       && args+=("--top"  "$HERALD_TOP")
          [ "$HERALD_NO_RERANK" = "true" ] && args+=("--no-rerank")
          echo "Running: herald ${args[*]}"
          uv run herald "${args[@]}"
